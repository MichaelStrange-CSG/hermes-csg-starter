# Claude Code CLI (`claude`). Minimum for every 5.5 model alias; tested version.
CLAUDE_CODE_MIN=2.1.293
CLAUDE_CODE_TESTED=2.1.300

# Models tried in order until one answers on the user's plan. Opus first on every plan, Pro included.
MODEL_PREFERENCE=claude-opus-5-5[1m],claude-opus-5-5,claude-sonnet-5-5
# Default thinking depth (agent.reasoning_effort) for both profiles.
REASONING_EFFORT=high

# Platform floors (Node.js 26 and Claude Code requirements).
MACOS_MIN=13.5
WINDOWS_MIN_BUILD=17763
MIN_FREE_GB=10
